# Example site configuration for the self-documenting example content.
#
# This drives the build when SITE_ENV=example (and the golden tests). It uses
# neutral values so the generated output carries no personal identity.
site:
  name: Example
  description: An example site
  author: Example Author
  copyrightYear: 2020
  domain: example.com
  twitterHandle: example

contact:
  email: contact@example.com
  page: /contact

manifest:
  backgroundColor: "#fff"
  themeColor: "hsl(210, 75%, 50%)"

mathjax:
  version: "4.1.3"

highlight:
  style: pygments

feed:
  size: 20

robots:
  disallow: [/404.html]

security:
  preferredLanguages: en, es
  expires: "2027-12-31T22:59:00.000Z"
  expirationMarginDays: 90

trust:
  trainingAllowed: "no"

funding:
  entity:
    email: contact@example.com
    description: "An example site."
  projects:
    - guid: example-site
      name: "Example Site"
      description: "An example project."
      repositoryUrl: "https://github.com/example/example-site"
      repositoryWellKnown: "https://github.com/example/example-site/blob/master/static/.well-known/funding-manifest-urls"
      licenses: ["spdx:GPL-3.0-or-later"]
      tags: ["example"]
  channels:
    - guid: example-bank
      type: bank
      address: ""
      description: "An example bank account."
  plans:
    - guid: custom-eur
      status: active
      name: "Single Payment"
      description: "An example plan."
      amount: 0
      currency: EUR
      frequency: one-time
      channels: ["example-bank"]
