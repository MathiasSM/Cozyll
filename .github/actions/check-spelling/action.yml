# Consumer-facing composite action: run a spelling check with typos (advisory).
# Uses the pinned crate-ci/typos action. Advisory only; mixed-language content needs an allow-list.
name: check-spelling
description: Check spelling with typos. Advisory only, and not suitable as a hard gate for mixed-language content.
inputs:
  content-dir:
    description: Directory to check.
    required: false
    default: content
  config:
    description: Optional path to a typos config file.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run typos
      uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      with:
        files: ${{ inputs.content-dir }}
        config: ${{ inputs.config }}
