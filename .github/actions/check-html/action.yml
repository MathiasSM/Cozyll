# Consumer-facing composite action: validate generated markup with the W3C Nu checker.
# Requires Java; downloads vnu.jar (sha1-verified) to the temp dir.
name: check-html
description: Validate generated HTML, CSS and SVG with the W3C Nu checker.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "17"
    - name: Validate
      shell: bash
      run: |
        bash "${{ github.action_path }}/../../../scripts/check-site.sh" html \
          --site-dir "${{ inputs.site-dir }}"
