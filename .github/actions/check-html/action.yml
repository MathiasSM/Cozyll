# Consumer-facing composite action: validate generated markup with the W3C Nu checker.
name: check-html
description: Validate generated HTML, CSS and SVG with the W3C Nu checker.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "17"
    - name: Download vnu
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/vnu.jar" https://github.com/validator/validator/releases/latest/download/vnu.jar
        curl -fsSL -o "$RUNNER_TEMP/vnu.jar.sha1" https://github.com/validator/validator/releases/latest/download/vnu.jar.sha1
        ( cd "$RUNNER_TEMP" && sha1sum -c vnu.jar.sha1 )
    - name: Validate
      shell: bash
      run: |
        set -euo pipefail
        java -jar "$RUNNER_TEMP/vnu.jar" \
          --skip-non-html --also-check-css --also-check-svg --errors-only \
          "${{ inputs.site-dir }}"
