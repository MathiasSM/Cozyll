# Consumer-facing composite action: validate that generated XML is well formed.
# Requires xmllint (libxml2-utils).
name: check-xml
description: Validate that generated XML files (feeds, sitemap) are well formed.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
runs:
  using: composite
  steps:
    - name: Install xmllint
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils
    - name: Check XML
      shell: bash
      run: |
        bash "${{ github.action_path }}/../../../scripts/check-site.sh" xml \
          --site-dir "${{ inputs.site-dir }}"
