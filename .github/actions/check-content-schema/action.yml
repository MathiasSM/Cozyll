# Consumer-facing composite action: validate content YAML against the Cozyll schemas.
name: check-content-schema
description: Validate website.yaml, authors.yaml and socials.yaml against the shipped JSON schemas.
inputs:
  content-dir:
    description: Directory containing website.yaml, authors.yaml and socials.yaml.
    required: false
    default: content
  schema-dir:
    description: Directory containing the JSON schemas.
    required: false
    default: schema
runs:
  using: composite
  steps:
    - name: Validate content files
      shell: bash
      run: |
        set -euo pipefail
        for pair in website:website.yaml authors:authors.yaml socials:socials.yaml; do
          schema="${pair%%:*}"
          file="${pair##*:}"
          if [ -f "${{ inputs.content-dir }}/$file" ]; then
            echo "validating $file against $schema.schema.json"
            pipx run check-jsonschema \
              --schemafile "${{ inputs.schema-dir }}/$schema.schema.json" \
              "${{ inputs.content-dir }}/$file"
          else
            echo "skipping missing ${{ inputs.content-dir }}/$file"
          fi
        done
