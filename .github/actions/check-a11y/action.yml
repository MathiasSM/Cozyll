# Consumer-facing composite action: accessibility audit with pa11y-ci.
# Requires Python 3, npx and Chrome; uses `chromeLaunchConfig --no-sandbox` on CI runners.
# Advisory in site-ci.yml and the dogfood.
name: check-a11y
description: Audit the built site for accessibility with pa11y-ci using the axe runner.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
  port:
    description: Local port used to serve the site.
    required: false
    default: "8080"
  standard:
    description: WCAG standard to check.
    required: false
    default: WCAG2AA
runs:
  using: composite
  steps:
    - name: Serve and audit
      shell: bash
      run: |
        bash "${{ github.action_path }}/../../../scripts/check-site.sh" a11y \
          --site-dir "${{ inputs.site-dir }}" \
          --port "${{ inputs.port }}" \
          --standard "${{ inputs.standard }}"
