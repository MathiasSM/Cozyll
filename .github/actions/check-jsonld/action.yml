# Consumer-facing composite action: validate JSON-LD blocks in generated HTML.
# Requires Python 3; checks that each block parses and declares @context and @type or @graph.
name: check-jsonld
description: Validate that JSON-LD blocks in generated HTML parse and declare @context and @type or @graph.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
runs:
  using: composite
  steps:
    - name: Check JSON-LD
      shell: bash
      run: |
        bash "${{ github.action_path }}/../../../scripts/check-site.sh" jsonld \
          --site-dir "${{ inputs.site-dir }}"
