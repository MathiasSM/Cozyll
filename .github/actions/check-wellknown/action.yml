# Consumer-facing composite action: validate generated well-known and metadata files.
# Requires Python 3; checks robots.txt, manifest, funding.json, sitemap, security.txt and trust.txt.
name: check-wellknown
description: Validate generated security.txt, funding.json, manifest, robots, trust and sitemap files.
inputs:
  site-dir:
    description: Directory containing the built site.
    required: false
    default: _site
runs:
  using: composite
  steps:
    - name: Check well-known files
      shell: bash
      run: |
        bash "${{ github.action_path }}/../../../scripts/check-site.sh" wellknown \
          --site-dir "${{ inputs.site-dir }}"
