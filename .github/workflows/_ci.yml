# Verify and test the site generator.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    uses: ./.github/workflows/hlint.yml
    permissions:
      security-events: write
      contents: read

  format:
    uses: ./.github/workflows/fourmolu.yml
    with:
      fourmolu-version: ${{ vars.FOURMOLU_VERSION }}

  build:
    uses: ./.github/workflows/build-test.yml
    with:
      ghc-version: ${{ vars.GHC_VERSION }}
      cabal-version: ${{ vars.CABAL_VERSION }}

  upload-codecov:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage artifact
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-coverage
      - name: Download test results artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-test-results
      - name: Upload unit coverage to Codecov
        if: ${{ needs.build.result == 'success' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          files: cobertura.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload golden coverage to Codecov
        if: ${{ needs.build.result == 'success' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          files: cobertura-golden.xml
          flags: golden
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload unit test results to Codecov
        if: ${{ hashFiles('junit.xml') != '' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          report_type: test_results
          files: junit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload golden test results to Codecov
        if: ${{ hashFiles('junit-golden.xml') != '' }}
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          report_type: test_results
          files: junit-golden.xml
          flags: golden
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  changelog-gate:
    name: Verify version in Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changelog entry for version bumps
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          old_version="$(git show "$BASE:cozyll.cabal" | awk '/^version:/{print $2}')"
          new_version="$(awk '/^version:/{print $2}' cozyll.cabal)"

          if [ "$old_version" = "$new_version" ]; then
            echo "Version unchanged ($new_version); no changelog entry required."
            exit 0
          fi

          if grep -Fq "[$new_version]" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for $new_version."
          else
            echo "::error::Version bumped to $new_version but CHANGELOG.md has no [$new_version] entry."
            exit 1
          fi
