# Weekly check for outdated Haskell dependencies.
name: Outdated dependencies

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # Block only high/critical vulnerabilities. Note: this action reviews
          # the GitHub Actions dependencies, not the Haskell/Cabal ones.
          fail-on-severity: high
          # Only comment on the PR when there is something to report.
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
          show-patched-versions: true

  outdated:
    name: Check for outdated dependencies
    # PR runs must not touch the issue: a merge would race the pull_request run
    # of the same commit, and fork PRs only get a read-only token.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # One run at a time (queued, not cancelled) so the lookup-then-write
    # sequence cannot interleave and open a second issue. Repository-scoped.
    concurrency:
      group: outdated-dependencies
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ vars.GHC_VERSION }}
          cabal-version: ${{ vars.CABAL_VERSION }}

      - name: Reconcile the outdated dependencies issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/outdated-issue.sh
