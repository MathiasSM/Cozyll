# Reusable lint job: runs HLint and uploads the result to GitHub code scanning.
name: Lint (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: HLint Scan
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload results to GitHub code scanning.
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell-actions/hlint-scan@58c27088e4e1a45d453d9ade58b5ad34d09b0627 # v1.4.0
