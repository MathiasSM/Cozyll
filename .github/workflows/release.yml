# Release the site generator: on a version bump, tag it, publish a versioned
# GitHub release (marked latest) and a Hackage candidate, and deploy the docs.
# Dispatch manually to dry-run the kit build and smoke test without tagging or
# publishing.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autotag:
    name: Tag version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag if the version was bumped
        id: tag
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --tags --force
          VERSION="$(grep '^version:' cozyll.cabal | awk '{print $2}')"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            # Tag the pushed commit. Tagging the original version-bump commit
            # would be refused when a later commit touched .github/workflows/:
            # the Actions token cannot create a tag whose tree differs from the
            # branch's workflow files.
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: autotag
    if: needs.autotag.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build-test.yml
    with:
      ghc-version: ${{ vars.GHC_VERSION }}
      cabal-version: ${{ vars.CABAL_VERSION }}

  release-binary:
    name: Static kit binary
    needs: autotag
    if: needs.autotag.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The kit binary is a fully static executable: it has no glibc or shared
    # library requirements and runs on any Linux x86_64 distribution. Cabal's
    # --enable-executable-static links the GHC RTS and every Haskell/C
    # dependency into the executable; the job is coverage-free, so it never
    # writes `cozyll.tix`.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ vars.GHC_VERSION }}
          cabal-version: ${{ vars.CABAL_VERSION }}

      - name: Install static system libraries
        # The runner image has the shared libraries GHC needs at runtime, but
        # static linking also needs the .a archives.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgmp-dev libffi-dev zlib1g-dev libnuma-dev libncurses-dev

      - name: Build the static binary
        run: |
          set -euo pipefail
          cabal build exe:cozyll --enable-executable-static
          cp "$(cabal list-bin exe:cozyll)" artifact-executable
          chmod 755 artifact-executable
          strip --strip-all artifact-executable

      - name: Assert it is statically linked
        run: |
          set -euo pipefail
          file artifact-executable
          file artifact-executable | grep -q 'statically linked'
          if ldd artifact-executable 2>&1 | grep -q 'not a dynamic executable'; then
            echo "no dynamic dependencies"
          else
            echo "::error::artifact-executable is dynamically linked"
            ldd artifact-executable || true
            exit 1
          fi
          ./artifact-executable --version

      - name: Upload executable as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: artifact-executable
          name: artifact-executable

  versioned:
    name: Versioned release
    needs: [build, release-binary, autotag]
    if: needs.autotag.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-executable

      - name: Assemble the kit
        run: |
          chmod +x artifact-executable
          mkdir -p kit/docs
          cp artifact-executable kit/cozyll
          cp -r templates kit/
          cp -r assets kit/
          cp -r schema kit/
          cp -r scripts kit/
          cp README.md kit/
          cp docs/authoring.md docs/theming.md docs/consumer-ci.md kit/docs/
          tar -czf cozyll-kit.tar.gz -C kit .
          sha256sum cozyll-kit.tar.gz > cozyll-kit.tar.gz.sha256

      - name: Smoke-test the kit
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p smoke
          tar -xzf cozyll-kit.tar.gz -C smoke
          cp -r example-content smoke/example-content
          ( cd smoke && SITE_ENV=example ./cozyll build -v && SITE_ENV=example ./cozyll check )

      - uses: ./.github/actions/check-html
        with:
          site-dir: smoke/_site
      - uses: ./.github/actions/check-a11y
        continue-on-error: true
        with:
          site-dir: smoke/_site
      - uses: ./.github/actions/check-jsonld
        with:
          site-dir: smoke/_site
      - uses: ./.github/actions/check-xml
        with:
          site-dir: smoke/_site

      - name: Publish versioned release
        if: github.event_name != 'workflow_dispatch'
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          tag_name: ${{ needs.autotag.outputs.name }}
          draft: true
          make_latest: true
          generate_release_notes: true
          files: |
            cozyll-kit.tar.gz
            cozyll-kit.tar.gz.sha256

  hackage:
    name: Publish Hackage candidate
    needs: [build, autotag]
    if: needs.autotag.outputs.created == 'true' && vars.HACKAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ vars.GHC_VERSION }}
          cabal-version: ${{ vars.CABAL_VERSION }}

      - name: Build source distribution
        run: |
          cabal check
          cabal sdist

      - name: Publish candidate to Hackage
        uses: haskell-actions/hackage-publish@0fa2122fae62cebe8ba3b0fe9b036cc736337230 # v1
        with:
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: ${{ github.workspace }}/dist-newstyle/sdist
          publish: false

  deploy-docs:
    name: Deploy documentation
    needs: [build, autotag]
    if: needs.autotag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-docs
          path: artifact-docs
      - run: ls -R .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifact-docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
