# Release the site generator: on a version bump, tag it, publish a versioned
# GitHub release (marked latest) and a Hackage candidate, and deploy the docs.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  autotag:
    name: Tag version bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag if the version was bumped
        id: tag
        run: |
          git fetch --tags --force
          VERSION="$(grep '^version:' cozyll.cabal | awk '{print $2}')"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            # Tag the commit that bumped the version, not HEAD.
            COMMIT="$(git log -1 --format='%H' -G "^version:.*${VERSION}" -- cozyll.cabal)"
            [ -n "$COMMIT" ] || COMMIT="$GITHUB_SHA"
            git tag "$TAG" "$COMMIT"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: autotag
    if: needs.autotag.outputs.created == 'true'
    uses: ./.github/workflows/build-test.yml
    with:
      ghc-version: ${{ vars.GHC_VERSION }}
      cabal-version: ${{ vars.CABAL_VERSION }}

  versioned:
    name: Publish versioned GitHub release
    needs: [build, autotag]
    if: needs.autotag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-executable

      - name: Assemble the kit
        run: |
          chmod +x artifact-executable
          mkdir -p kit
          cp artifact-executable kit/cozyll
          cp -r templates kit/
          cp -r assets kit/
          tar -czf cozyll-kit.tar.gz -C kit .
          sha256sum cozyll-kit.tar.gz > cozyll-kit.tar.gz.sha256

      - name: Publish versioned release
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          tag_name: ${{ needs.autotag.outputs.name }}
          draft: true
          make_latest: true
          generate_release_notes: true
          files: |
            cozyll-kit.tar.gz
            cozyll-kit.tar.gz.sha256

  hackage:
    name: Publish Hackage candidate
    needs: [build, autotag]
    if: needs.autotag.outputs.created == 'true' && vars.HACKAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ vars.GHC_VERSION }}
          cabal-version: ${{ vars.CABAL_VERSION }}

      - name: Build source distribution
        run: |
          cabal check
          cabal sdist

      - name: Publish candidate to Hackage
        uses: haskell-actions/hackage-publish@0fa2122fae62cebe8ba3b0fe9b036cc736337230 # v1
        with:
          hackageToken: ${{ secrets.HACKAGE_AUTH_TOKEN }}
          packagesPath: ${{ github.workspace }}/dist-newstyle/sdist
          publish: false

  deploy-docs:
    name: Deploy documentation
    needs: [build, autotag]
    if: needs.autotag.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-docs
          path: artifact-docs
      - run: ls -R .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifact-docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
