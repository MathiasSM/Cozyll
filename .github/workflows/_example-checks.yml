# Internal (not a consumer contract). Dogfoods the consumer checks against example-content.
name: Example checks (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  example-checks:
    name: Example site checks
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-executable
      - name: Assemble a local kit
        run: |
          set -euo pipefail
          chmod +x artifact-executable
          mkdir -p kit/docs
          cp artifact-executable kit/cozyll
          cp -r templates assets schema kit/
          cp README.md kit/
          cp docs/authoring.md docs/theming.md docs/consumer-ci.md kit/docs/
          tar -czf cozyll-kit.tar.gz -C kit .
      - uses: ./.github/actions/setup-cozyll
        with:
          kit-tarball: ${{ github.workspace }}/cozyll-kit.tar.gz
      - name: Build the example site
        env:
          SITE_ENV: example
        run: cozyll build -v
      - name: Internal links
        env:
          SITE_ENV: example
        run: cozyll check
      - uses: ./.github/actions/check-content-schema
        with:
          content-dir: example-content
          schema-dir: schema
      - uses: ./.github/actions/check-html
        with:
          site-dir: _site
      - uses: ./.github/actions/check-a11y
        continue-on-error: true
        with:
          site-dir: _site
      - uses: ./.github/actions/check-jsonld
        with:
          site-dir: _site
      - uses: ./.github/actions/check-wellknown
        with:
          site-dir: _site
      - uses: ./.github/actions/check-xml
        with:
          site-dir: _site
      - name: Spelling (advisory)
        continue-on-error: true
        uses: ./.github/actions/check-spelling
        with:
          content-dir: example-content
      - name: External links (advisory)
        continue-on-error: true
        uses: ./.github/actions/check-links-external
        with:
          site-dir: _site
          config: .github/lychee.toml
