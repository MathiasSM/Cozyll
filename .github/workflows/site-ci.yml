# Consumer-facing reusable workflow: build a Cozyll content repo and run optional checks.
name: Cozyll site CI

on:
  workflow_call:
    inputs:
      content-repo:
        description: Owner/repo of the content repo to check out (for example acme/content). Empty checks out the calling repository.
        required: false
        type: string
        default: ""
      cozyll-version:
        description: Kit release tag (for example v3.1.0.1) or "latest". Authoritative when set; otherwise read from content/.cozyll-version, then fall back to "latest".
        required: false
        type: string
        default: ""
      site-domain:
        description: Value for SITE_DOMAIN. Leave empty to use website.yaml.
        required: false
        type: string
        default: ""
      run-links-internal:
        description: Run the internal link check (cozyll check).
        required: false
        type: boolean
        default: true
      run-content-schema:
        description: Validate content YAML against the shipped schemas.
        required: false
        type: boolean
        default: true
      run-html:
        description: Validate generated HTML, CSS and SVG.
        required: false
        type: boolean
        default: true
      run-a11y:
        description: Run the accessibility audit.
        required: false
        type: boolean
        default: true
      run-jsonld:
        description: Validate JSON-LD blocks.
        required: false
        type: boolean
        default: true
      run-wellknown:
        description: Validate well-known and metadata files.
        required: false
        type: boolean
        default: true
      run-xml:
        description: Validate generated XML well-formedness.
        required: false
        type: boolean
        default: true
      run-links-external:
        description: Check external links with lychee.
        required: false
        type: boolean
        default: false
      run-spelling:
        description: Run typos (advisory).
        required: false
        type: boolean
        default: false
    secrets:
      content-token:
        description: Token used to check out the content repo (for example a PAT or deploy key with contents:read). Empty uses the workflow's GITHUB_TOKEN.
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.content-repo || github.repository }}
          token: ${{ secrets.content-token || github.token }}
          path: content
      - name: Resolve Cozyll version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.cozyll-version }}"
          if [ -z "$v" ] && [ -f content/.cozyll-version ]; then
            v="$(head -n 1 content/.cozyll-version | tr -d '[:space:]')"
          fi
          if [ -z "$v" ]; then
            v="latest"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-cozyll
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Build
        env:
          SITE_DOMAIN: ${{ inputs.site-domain }}
        run: cozyll build -v
      - name: Internal link check
        if: inputs.run-links-internal
        run: cozyll check
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          include-hidden-files: true

  content-schema:
    name: Content schema
    if: inputs.run-content-schema
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.content-repo || github.repository }}
          token: ${{ secrets.content-token || github.token }}
          path: content
      - name: Resolve Cozyll version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.cozyll-version }}"
          if [ -z "$v" ] && [ -f content/.cozyll-version ]; then
            v="$(head -n 1 content/.cozyll-version | tr -d '[:space:]')"
          fi
          if [ -z "$v" ]; then
            v="latest"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: $/.github/actions/setup-cozyll
        with:
          version: ${{ steps.version.outputs.version }}
          install-imagemagick: "false"
      - uses: $/.github/actions/check-content-schema
        with:
          content-dir: content
          schema-dir: schema

  html:
    name: HTML
    if: inputs.run-html
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: $/.github/actions/check-html
        with:
          site-dir: _site

  a11y:
    name: Accessibility
    if: inputs.run-a11y
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: $/.github/actions/check-a11y
        continue-on-error: true
        with:
          site-dir: _site

  jsonld:
    name: JSON-LD
    if: inputs.run-jsonld
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: $/.github/actions/check-jsonld
        with:
          site-dir: _site

  wellknown:
    name: Well-known files
    if: inputs.run-wellknown
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: $/.github/actions/check-wellknown
        with:
          site-dir: _site

  xml:
    name: XML
    if: inputs.run-xml
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: $/.github/actions/check-xml
        with:
          site-dir: _site

  links-external:
    name: External links
    if: inputs.run-links-external
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.content-repo || github.repository }}
          token: ${{ secrets.content-token || github.token }}
          path: content
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - name: Resolve lychee config
        id: lychee-config
        shell: bash
        run: |
          set -euo pipefail
          if [ -f content/config/lychee.toml ]; then
            echo "config=content/config/lychee.toml" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi
      - uses: $/.github/actions/check-links-external
        with:
          site-dir: _site
          config: ${{ steps.lychee-config.outputs.config }}
          fail: "true"

  spelling:
    name: Spelling (advisory)
    if: inputs.run-spelling
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.content-repo || github.repository }}
          token: ${{ secrets.content-token || github.token }}
          path: content
      - uses: $/.github/actions/check-spelling
        with:
          content-dir: content
