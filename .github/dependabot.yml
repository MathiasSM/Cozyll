version: 2
updates:
  # Check for updates to GitHub Actions every week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Codeql has different actions that need to run with the same version.
      # Otherwise, CI fails. 
      codeql-action:
        patterns:
          - "github/codeql-action/*"
