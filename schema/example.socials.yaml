# yaml-language-server: $schema=https://raw.githubusercontent.com/MathiasSM/Cozyll/master/schema/socials.schema.json
# Example social accounts. A content repo needs a proper socials.yaml.
#
# One account per list item:
#   icon        Icon under content/media/icons/social/, without the .svg extension.
#   href        URL the account links to.
#   username    Handle shown on the link.
#   _show       Whether to show the account (default: true; _show: false hides it).

# A GitHub account, shown in the social links.
- icon: github
  href: https://github.com/example
  username: example

# A Twitter/X account, hidden with _show: false.
- icon: twitter
  href: https://x.com/example
  username: "@example"
  _show: false
