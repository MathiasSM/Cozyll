<label class="ruby-control">
  $rubyControlLabel$
  <select data-ruby-threshold>
    <option value="n5">$t("ruby.N5-or-harder")$</option>
    <option value="n4">$t("ruby.N4-or-harder")$</option>
    <option value="n3">$t("ruby.N3-or-harder")$</option>
    <option value="n2">$t("ruby.N2-or-harder")$</option>
    <option value="n1">$t("ruby.N1-or-harder")$</option>
    <option value="none">$t("ruby.none")$</option>
  </select>
</label>
