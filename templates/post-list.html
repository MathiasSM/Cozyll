<ol class="main-list h-feed">
    $for(posts)$
        <li class="h-entry">
            <a class="u-url" href="$url$">
                <article>
                    <header lang="$language$">
                        <h2 class="p-name">$title$</h2>
                        $partial("templates/post-date.html")$
                    </header>
                    $if(description)$<div class="p-summary">$description$</div>$endif$
                </article>
            </a>
        </li>
    $endfor$
</ol>
