<div class="post-date-header">
  $if(author)$<span class="post-authors">$for(author)$$displayName$$sep$, $endfor$</span><span> · </span>$endif$
  <time datetime="$date$">$date$</time>
  $if(lang-es)$
    $if(lastModifiedAt)$<span> (Actualizado: <time datetime="$lastModifiedAt$">$lastModifiedAt$</time>)</span>$endif$
  $else$
    $if(lastModifiedAt)$<span> (Updated: <time datetime="$lastModifiedAt$">$lastModifiedAt$</time>)</span>$endif$
  $endif$
</div>
