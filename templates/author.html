<article class="main-article">
  <header>
    <h1>$name$</h1>
    $if(profileImage)$<img src="$profileImage$" alt="$name$" />$endif$
    $if(description)$<p>$description$</p>$endif$
    $if(links)$<ul class="author-links">$for(links)$<li><a href="$url$">$url$</a></li>$endfor$</ul>$endif$
  </header>
  $partial("templates/post-list.html")$
</article>
