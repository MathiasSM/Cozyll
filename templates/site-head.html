<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="stylesheet" href="/styles.css" />

    $if(jsonld)$$jsonld$$endif$
    $if(opengraph)$$opengraph$$endif$

    $for(feeds)$<link rel="alternate" type="application/atom+xml" title="$title$" href="$href$" />$endfor$

    <link rel="canonical" href="$site-baseUrl$$path$"/>
    <title>$if(home)$$site-title$ - $site-description$$else$$title$ - $site-title$$endif$</title>
    $if(description)$<meta name="description" content="$description$" />$endif$

    $for(favicons)$<link rel="$rel$" href="$href$"$if(type)$ type="$type$"$endif$$if(sizes)$ sizes="$sizes$"$endif$>
    $endfor$<link rel="manifest" href="/manifest.webmanifest">

    $if(math)$<script defer src="https://cdn.jsdelivr.net/npm/mathjax@$mathjax-version$/tex-chtml.js"></script>$endif$
</head>
